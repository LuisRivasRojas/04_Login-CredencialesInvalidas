<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Módulo de Inicio de Sesión de EventPass">
  <title>EventPass | Iniciar Sesión</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <!-- Fondos Decorativos Animados -->
  <div class="bg-gradient-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <main class="main-container">
    
    <!-- Tarjeta Principal de Login (Glassmorphism) -->
    <div class="card-login" id="loginCard">
      
      <!-- Encabezado y Marca EventPass -->
      <div class="brand-header">
        <div class="brand-logo" id="brandLogo">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="3"></rect>
            <path d="M12 12h.01"></path>
            <path d="M17 12h.01"></path>
            <path d="M7 12h.01"></path>
          </svg>
        </div>
        <h1 class="brand-title">Event<span>Pass</span></h1>
        <p class="brand-subtitle">Plataforma de Gestión de Eventos</p>
      </div>

      <!-- Contenedores de Alerta para Respuestas del Backend -->
      <div class="alert alert-error hidden" id="errorMessage" role="alert">
        <span class="alert-icon">❌</span>
        <span class="alert-text" id="errorText">Credenciales incorrectas</span>
      </div>

      <div class="alert alert-success hidden" id="successMessage" role="alert">
        <span class="alert-icon">✅</span>
        <span class="alert-text" id="successText">Inicio de sesión exitoso</span>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form id="loginForm" novalidate>
        
        <!-- Campo Correo Electrónico -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="correo" 
              placeholder="ejemplo.prueba@correo.com" 
              required 
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="contrasena" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password" id="togglePassword" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
              <svg id="eyeIconShow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeIconHide" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botón Iniciar Sesión -->
        <button type="submit" class="btn-submit" id="loginButton">
          <span id="buttonText">Iniciar sesión</span>
          <span class="spinner hidden" id="loadingSpinner" aria-hidden="true"></span>
        </button>

      </form>

      <div class="card-footer">
        <small>© 2026 EventPass • Todos los derechos reservados</small>
      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
